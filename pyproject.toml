[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "event-video-recognition"
version = "1.0.0"
description = "Deep learning project for registering action events in video recordings"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "torch>=2.1",
  "torchvision>=0.16",
  "tqdm>=4.66",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
x3d = ["pytorchvideo>=0.1.5"]
web = ["streamlit>=1.31"]
pose = ["mediapipe>=0.10"]
dev = ["pytest>=7.4", "streamlit>=1.31"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
